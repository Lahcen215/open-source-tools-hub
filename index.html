
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open Source Tools Hub</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#0f172a;color:#e2e8f0}
header{text-align:center;padding:45px 20px;background:#1e293b}
header h1{color:#38bdf8;margin:0 0 12px}
header p{color:#94a3b8}
main{max-width:1000px;margin:30px auto;padding:0 16px}
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.card{background:#1e293b;padding:22px;border:1px solid #334155;border-radius:12px}
h2{font-size:20px;margin-top:0}
textarea,input,button{width:100%;padding:12px;margin:8px 0;border-radius:7px;font:inherit}
textarea,input{background:#0f172a;color:white;border:1px solid #475569}
textarea{min-height:110px;resize:vertical}
button{background:#0284c7;color:white;border:0;cursor:pointer;font-weight:bold}
button:hover{background:#0369a1}
.result{color:#7dd3fc;overflow-wrap:anywhere}
footer{text-align:center;padding:30px;color:#94a3b8}
</style>
</head>
<body>

<header>
<h1>Open Source Tools Hub</h1>
<p>Free, simple and useful online developer tools.</p>
</header>

<main>
<div class="tools">

<section class="card">
<h2>JSON Formatter</h2>
<textarea id="jsonInput" placeholder='Paste JSON here...'></textarea>
<button onclick="formatJSON()">Format JSON</button>
<p id="jsonResult" class="result"></p>
</section>

<section class="card">
<h2>Password Generator</h2>
<input id="passLength" type="number" min="8" max="64" value="16">
<button onclick="generatePassword()">Generate Password</button>
<p id="passResult" class="result"></p>
</section>

<section class="card">
<h2>Date Calculator</h2>
<label>Start date</label>
<input id="dateStart" type="date">
<label>End date</label>
<input id="dateEnd" type="date">
<button onclick="calculateDate()">Calculate Difference</button>
<p id="dateResult" class="result"></p>
</section>

<section class="card">
<h2>Text & Code Counter</h2>
<textarea id="textInput" placeholder="Type or paste your text..."></textarea>
<p id="textResult" class="result">0 words · 0 characters · 0 lines</p>
</section>

</div>
</main>

<footer>
<p>Free and open source · MIT License</p>
</footer>

<script>
function formatJSON(){
  const input=document.getElementById("jsonInput").value;
  const result=document.getElementById("jsonResult");
  try{
    result.textContent=JSON.stringify(JSON.parse(input),null,2);
  }catch{
    result.textContent="Invalid JSON. Please check your input.";
  }
}

function generatePassword(){
  const length=Number(document.getElementById("passLength").value);
  const result=document.getElementById("passResult");
  if(!Number.isInteger(length)||length<8||length>64){
    result.textContent="Choose a length between 8 and 64.";
    return;
  }
  const chars="ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%&*";
  const values=new Uint32Array(length);
  crypto.getRandomValues(values);
  result.textContent=Array.from(values,n=>chars[n%chars.length]).join("");
}

function calculateDate(){
  const start=document.getElementById("dateStart").value;
  const end=document.getElementById("dateEnd").value;
  const result=document.getElementById("dateResult");
  if(!start||!end){
    result.textContent="Please select both dates.";
    return;
  }
  const days=Math.abs(Date.parse(end)-Date.parse(start))/86400000;
  result.textContent=days+" days between the selected dates.";
}

document.getElementById("textInput").addEventListener("input",function(){
  const text=this.value;
  const words=text.trim()?text.trim().split(/\s+/).length:0;
  const lines=text?text.split(/\n/).length:0;
  document.getElementById("textResult").textContent=
    words+" words · "+text.length+" characters · "+lines+" lines";
});
</script>

</body>
</html>
